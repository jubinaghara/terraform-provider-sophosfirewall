name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod download
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build -v .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Docs are up to date
        run: |
          go generate ./...
          git diff --exit-code -- docs || (echo "Run 'make docs' and commit the result." && exit 1)
      - name: Examples are formatted
        run: terraform fmt -check -recursive examples

  test:
    name: Terraform ${{ matrix.terraform }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.5.*", "1.9.*", "1.12.*", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      # Runs every resource end to end against the in-memory SFOS API fake.
      - run: go test -v -cover ./...
        timeout-minutes: 15
